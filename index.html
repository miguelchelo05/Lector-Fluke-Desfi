<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capturador Fluke Impulse 7000DP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* CONTENEDOR DE LA PANTALLA DE INICIO DE SESIÓN */
        #loginScreen {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        #loginScreen h2 {
            color: #003366;
            margin-bottom: 10px;
        }

        #loginScreen p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .btn-login-main {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-guest {
            width: 100%;
            padding: 10px;
            background-color: transparent;
            color: #6c757d;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-login-main:hover { background-color: #0056b3; }
        .btn-guest:hover { background-color: #f8f9fa; color: #333; }

        /* CONTENEDOR DE LA APLICACIÓN PRINCIPAL (Oculto hasta iniciar sesión o entrar) */
        #appContainer {
            display: none;
            max-width: 850px;
            width: 95%;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: 20px auto;
        }

        /* Barra superior dentro de la app */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        h1 {
            color: #003366;
            font-size: 22px;
            margin-top: 0;
        }

        .status {
            font-weight: bold;
            margin-bottom: 15px;
        }
        .status.disconnected { color: #d9534f; }
        .status.connected { color: #5cb85c; }

        .calibration-box {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .calibration-box input {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: #fff;
        }
        #btnConectar { background-color: #007bff; }
        #btnDesconectar { background-color: #6c757d; }
        #btnLimpiar { background-color: #6c757d; }
        #btnPdf { background-color: #28a745; }
        #btnHistorial { background-color: #ffc107; color: #333; }
        button:hover { opacity: 0.9; }

        #terminal {
            width: 100%;
            height: 280px;
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 4px;
            white-space: pre-wrap;
            overflow-y: auto;
            word-break: break-all;
            margin-bottom: 15px;
        }

        #historySection {
            margin-top: 20px;
            border-top: 2px solid #ddd;
            padding-top: 15px;
            display: none;
        }
        .history-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
            border-left: 4px solid #007bff;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE INICIO DE SESIÓN ESTILO GOOGLE / FORMULARIO -->
    <div id="loginScreen">
        <h2>Fluke Capture Tool</h2>
        <p>Inicia sesión para guardar tus historiales de pruebas o ingresa como invitado.</p>
        
        <input type="text" id="txtUserLogin" class="login-input" placeholder="Nombre de usuario o técnico..." />
        <button class="btn-login-main" onclick="entrarConUsuario()">Iniciar Sesión</button>
        <button class="btn-guest" onclick="entrarComoInvitado()">Continuar como Invitado</button>
    </div>

    <!-- 2. APLICACIÓN PRINCIPAL (Oculta hasta acceder) -->
    <div id="appContainer">
        <div class="top-bar">
            <div>👤 Usuario activo: <strong id="lblUsuarioActivo">Invitado</strong></div>
            <button onclick="cerrarSesion()" style="background-color: #dc3545; padding: 5px 10px; font-size: 12px;">Cambiar Usuario / Salir</button>
        </div>

        <h1>Capturador Fluke Impulse 7000DP</h1>
        <div class="status">Estado: <span id="lblEstado" class="status disconnected">Desconectado</span></div>

        <!-- Fecha de calibración persistente -->
        <div class="calibration-box">
            <label for="txtCalibDate">📅 Fecha de Calibración del Fluke:</label>
            <input type="date" id="txtCalibDate" onchange="guardarFechaCalibracion()">
        </div>

        <div class="buttons">
            <button id="btnConectar" onclick="conectarPuerto()">1. Conectar Puerto</button>
            <button id="btnDesconectar" onclick="desconectarPuerto()" disabled>Desconectar</button>
            <button id="btnLimpiar" onclick="limpiarPantalla()">Limpiar Pantalla</button>
            <button id="btnPdf" onclick="generarPDF()">2. Generar PDF / Imprimir</button>
            <button id="btnHistorial" onclick="guardarPruebaActual()" id="btnGuardarHistorial" style="display: none;">💾 Guardar en Historial</button>
        </div>

        <div id="terminal">Esperando conexión con el equipo Fluke...</div>

        <!-- HISTORIAL DE PRUEBAS -->
        <div id="historySection">
            <h3>📁 Historial de Pruebas Guardadas</h3>
            <div id="listaHistorial">No hay pruebas guardadas aún.</div>
        </div>
    </div>

    <script>
        let port;
        let reader;
        let inputStreamClosed;
        let keepReading = false;

        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const txtUserLogin = document.getElementById('txtUserLogin');
        const lblUsuarioActivo = document.getElementById('lblUsuarioActivo');
        const historySection = document.getElementById('historySection');
        const btnGuardarHistorial = document.getElementById('btnHistorial');
        const listaHistorial = document.getElementById('listaHistorial');
        const terminal = document.getElementById('terminal');
        const lblEstado = document.getElementById('lblEstado');
        const btnConectar = document.getElementById('btnConectar');
        const btnDesconectar = document.getElementById('btnDesconectar');
        const txtCalibDate = document.getElementById('txtCalibDate');

        // Al cargar la página, revisa si hay fecha guardada y si ya había una sesión activa
        window.onload = function() {
            const fechaGuardada = localStorage.getItem("fluke_fecha_calibracion");
            if (fechaGuardada) {
                txtCalibDate.value = fechaGuardada;
            } else {
                txtCalibDate.value = "2026-01-15";
            }

            const usuarioGuardado = localStorage.getItem("fluke_usuario");
            if (usuarioGuardado) {
                if (usuarioGuardado === "Invitado") {
                    abrirApp("Invitado", false);
                } else {
                    abrirApp(usuarioGuardado, true);
                }
            }
        };

        // Entrar con un nombre de usuario formal
        function entrarConUsuario() {
            const nombre = txtUserLogin.value.trim();
            if (nombre === "") {
                alert("Por favor ingresa un nombre de usuario.");
                return;
            }
            localStorage.setItem("fluke_usuario", nombre);
            abrirApp(nombre, true);
        }

        // Entrar rápido como invitado
        function entrarComoInvitado() {
            localStorage.setItem("fluke_usuario", "Invitado");
            abrirApp("Invitado", false);
        }

        // Muestra la pantalla de la app y oculta el login
        function abrirApp(usuario, permiteHistorial) {
            loginScreen.style.display = "none";
            appContainer.style.display = "block";
            lblUsuarioActivo.textContent = usuario;

            if (permiteHistorial) {
                historySection.style.display = "block";
                btnGuardarHistorial.style.display = "inline-block";
                cargarHistorial();
            } else {
                historySection.style.display = "none";
                btnGuardarHistorial.style.display = "none";
            }
        }

        // Cierra sesión y regresa a la pantalla de login central
        function cerrarSesion() {
            localStorage.removeItem("fluke_usuario");
            appContainer.style.display = "none";
            loginScreen.style.display = "block";
            txtUserLogin.value = "";
        }

        function guardarFechaCalibracion() {
            localStorage.setItem("fluke_fecha_calibracion", txtCalibDate.value);
        }

        async function conectarPuerto() {
            if (!("serial" in navigator)) {
                alert("Tu navegador no soporta la Web Serial API. Usa Google Chrome o Edge.");
                return;
            }

            try {
                port = await navigator.serial.requestPort({
                    filters: [{ usbVendorId: 0x0403, usbProductId: 0x6001 }]
                });

                await port.open({ baudRate: 115200 });

                lblEstado.textContent = "Conectado";
                lblEstado.className = "status connected";
                btnConectar.disabled = true;
                btnDesconectar.disabled = false;
                terminal.textContent = "Conexión establecida a 115200 baudios. Transfiere los datos desde el Impulse 7000DP...\n\n";

                keepReading = true;
                leerDatos();
            } catch (error) {
                console.error("Error al conectar:", error);
                lblEstado.textContent = "Error de conexión";
                lblEstado.className = "status disconnected";
            }
        }

        async function leerDatos() {
            const textDecoder = new TextDecoderStream();
            inputStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            try {
                while (keepReading) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        terminal.textContent += value;
                        terminal.scrollTop = terminal.scrollHeight;
                    }
                }
            } catch (error) {
                console.error("Error durante la lectura:", error);
            } finally {
                reader.releaseLock();
            }
        }

        async function desconectarPuerto() {
            keepReading = false;
            try {
                if (reader) await reader.cancel();
                if (inputStreamClosed) await inputStreamClosed.catch(() => {});
                if (port) await port.close();
            } catch (error) {
                console.error("Error al cerrar el puerto:", error);
            }

            lblEstado.textContent = "Desconectado";
            lblEstado.className = "status disconnected";
            btnConectar.disabled = false;
            btnDesconectar.disabled = true;
            terminal.textContent += "\n[Puerto desconectado]";
        }

        function limpiarPantalla() {
            terminal.textContent = "";
        }

        function guardarPruebaActual() {
            const contenido = terminal.textContent.trim();
            if (!contenido || contenido.includes("Esperando conexión")) {
                alert("No hay datos válidos en la terminal para guardar.");
                return;
            }

            const usuarioActual = localStorage.getItem("fluke_usuario") || "Invitado";
            const fechaHora = new Date().toLocaleString();
            
            const nuevaPrueba = {
                id: Date.now(),
                usuario: usuarioActual,
                fecha: fechaHora,
                datos: contenido
            };

            let historial = JSON.parse(localStorage.getItem("fluke_historial") || "[]");
            historial.unshift(nuevaPrueba);
            localStorage.setItem("fluke_historial", JSON.stringify(historial));

            cargarHistorial();
            alert("¡Prueba guardada en el historial!");
        }

        function cargarHistorial() {
            let historial = JSON.parse(localStorage.getItem("fluke_historial") || "[]");
            const usuarioActual = localStorage.getItem("fluke_usuario");
            const misPruebas = historial.filter(p => p.usuario === usuarioActual);

            if (misPruebas.length === 0) {
                listaHistorial.innerHTML = "No hay pruebas guardadas para este usuario.";
                return;
            }

            let html = "";
            misPruebas.forEach(p => {
                html += `
                    <div class="history-item">
                        <span>🕒 <strong>${p.fecha}</strong></span>
                        <div>
                            <button onclick="cargarPruebaEnTerminal(${p.id})" style="background-color: #007bff; padding: 5px 10px; font-size: 12px;">Cargar</button>
                            <button onclick="eliminarPrueba(${p.id})" style="background-color: #dc3545; padding: 5px 10px; font-size: 12px;">Eliminar</button>
                        </div>
                    </div>
                `;
            });
            listaHistorial.innerHTML = html;
        }

        function cargarPruebaEnTerminal(id) {
            let historial = JSON.parse(localStorage.getItem("fluke_historial") || "[]");
            const prueba = historial.find(p => p.id === id);
            if (prueba) {
                terminal.textContent = prueba.datos;
                alert("Prueba cargada en la terminal.");
            }
        }

        function eliminarPrueba(id) {
            let historial = JSON.parse(localStorage.getItem("fluke_historial") || "[]");
            historial = historial.filter(p => p.id !== id);
            localStorage.setItem("fluke_historial", JSON.stringify(historial));
            cargarHistorial();
        }

        function generarPDF() {
            const contenido = terminal.textContent;
            const fechaCalibracion = txtCalibDate.value || "No especificada";
            const fechaActual = new Date().toLocaleString();
            const usuarioActual = localStorage.getItem("fluke_usuario") || "Técnico General";

            const ventanaImpresion = window.open('', '', 'width=900,height=700');
            ventanaImpresion.document.write(`
                <html>
                    <head>
                        <title>Reporte Fluke Impulse 7000DP</title>
                        <style>
                            body { font-family: 'Courier New', Courier, monospace; padding: 20px; font-size: 12px; display: flex; flex-direction: column; min-height: 90vh; }
                            .header-info { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
                            .report-body { flex: 1; white-space: pre-wrap; }
                            .footer { margin-top: 30px; border-top: 1px solid #333; padding-top: 10px; font-size: 11px; color: #555; }
                        </style>
                    </head>
                    <body>
                        <div class="header-info">
                            <strong>INGENIERÍA CLÍNICA - REPORTE DE PRUEBA</strong><br>
                            Técnico / Evaluador: <strong>${usuarioActual}</strong>
                        </div>
                        <div class="report-body">${contenido}</div>
                        <div class="footer">
                            <strong>INFORMACIÓN METROLÓGICA DEL EQUIPO PATRÓN:</strong><br>
                            Analizador de Desfibrilador: Fluke Biomedical Impulse 7000DP<br>
                            Fecha de Última Calibración del Patrón: <strong>${fechaCalibracion}</strong><br>
                            Fecha de Emisión del Reporte: ${fechaActual}
                        </div>
                        <script>
                            window.onload = function() { window.print(); }
                        <\/script>
                    </body>
                </html>
            `);
            ventanaImpresion.document.close();
        }
    </script>
</body>
</html>
</html>
